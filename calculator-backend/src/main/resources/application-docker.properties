purge.cron.expression=0 0 5 * * ?
management.health.defaults.enabled=false
server.port=8080
spring.main.allow-bean-definition-overriding=true

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://app-db:5432/postgres?currentSchema=UserDb
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL9Dialect
# Matches dev behaviour: Flyway runs first (creates tables with lowercase column names),
# then Hibernate drops and recreates JPA entity tables with correct snake_case names.
# Consequence: JPA-entity data is wiped on every restart (same as dev).
spring.jpa.hibernate.ddl-auto=create

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.default-schema=userdb

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.redis.host=app-redis
spring.redis.port=6379

# ── Logging (quieter than dev) ────────────────────────────────────────────────
logging.level.org.hibernate.type=WARN
logging.level.org.springframework.security=WARN
