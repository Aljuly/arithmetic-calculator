events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name localhost;

        root  /usr/share/nginx/html;
        index index.html;

        # ── API reverse-proxy ──────────────────────────────────────────────
        # All /v1.0/* requests are forwarded to the Spring Boot backend.
        # The service name 'app-backend' is resolved by Docker's internal DNS.
        location /v1.0/ {
            proxy_pass         http://app-backend:8080/v1.0/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # ── Angular SPA ────────────────────────────────────────────────────
        location / {
            # Fall back to index.html so the Angular router handles all routes.
            try_files $uri $uri/ /index.html;

            gzip              on;
            gzip_http_version 1.1;
            gzip_disable      "MSIE [1-6]\.";
            gzip_min_length   256;
            gzip_vary         on;
            gzip_proxied      expired no-cache no-store private auth;
            gzip_types        text/plain text/css application/json
                              application/javascript application/x-javascript
                              text/xml application/xml application/xml+rss
                              text/javascript;
            gzip_comp_level   6;
        }
    }
}
